    <div class="card">

        <h3>📄 Create a Document</h3>

        <select>

            <option>Affidavit</option>

            <option>Legal Notice</option>

</body>
<script>
function generateDocument() {
    const name = document.querySelector('input').value;
    const type = document.querySelector('select').value;
    const details = document.querySelector('textarea').value;

    if (name.trim() === "") {
        alert("Please enter your name.");
        return;
    }

    document.querySelector('.card').innerHTML = `
        <h3>📄 Document Preview</h3>

        <p><strong>Document Type:</strong> ${type}</p>

        <hr style="margin:20px 0;">

        <h2 style="text-align:center;">${type}</h2>

        <br>

        <p><strong>Party Name:</strong> ${name}</p>

        <br>

        <p><strong>Details:</strong></p>
        <p>${details || "No additional details provided."}</p>

        <br><br>

        <p>
            This document is a draft generated by LegalEase
            for educational and informational purposes.
        </p>

        <button onclick="window.print()">🖨️ Print / Save Document</button>
    `;
}
</script>
